name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: fundpath_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - name: Build client and server (typecheck)
        run: pnpm build
      - name: Server tests
        run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: fundpath
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/fundpath
      JWT_SECRET: e2e-only-secret
      CLIENT_URL: http://localhost:4173
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm migrate:deploy
      - run: pnpm seed
      - run: pnpm --filter fundpath-client build
      - name: Start API and web
        run: |
          (cd server && nohup npx tsx src/index.ts > ../api.log 2>&1 &)
          (cd client && nohup npx vite preview --port 4173 > ../web.log 2>&1 &)
          sleep 8
          curl -sf http://localhost:4000/health && curl -sf http://localhost:4173/ > /dev/null
      - run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Browser smoke test
        run: node smoke.mjs
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: |
            e2e/e2e-out
            api.log
            web.log
